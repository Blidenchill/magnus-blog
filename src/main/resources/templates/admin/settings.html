<!DOCTYPE html>
<html lang="zh-CN" th:replace="~{fragments/admin-layout :: layout(~{::title}, ~{::section}, ~{})}">
<head>
    <meta charset="UTF-8">
    <title>个人资料 · Magnus 后台</title>
</head>
<body>
<section>
    <h1>个人资料</h1>
    <div th:if="${errors != null and !errors.isEmpty()}" class="flash flash-error">
        <ul>
            <li th:each="e : ${errors}" th:text="${e.value}"></li>
        </ul>
    </div>
    <form th:action="@{/admin/settings}" method="post" class="settings-form">
        <input type="hidden" name="version" th:value="${profile.version}">
        <input type="hidden" name="avatarMediaId" id="avatarMediaId" th:value="${profile.avatarMediaId}">
        <div class="field">
            <label for="name">名字 <span class="required">*</span></label>
            <input type="text" id="name" name="name" th:value="${profile.name}" maxlength="120" required>
        </div>
        <div class="field">
            <label for="bio">个人介绍</label>
            <textarea id="bio" name="bio" rows="4" th:text="${profile.bio}"></textarea>
        </div>
        <div class="field">
            <label for="contact">联系方式（公开展示，请确认不含敏感信息）</label>
            <input type="text" id="contact" name="contact" th:value="${profile.contact}" maxlength="500">
        </div>
        <div class="field">
            <label>头像</label>
            <div class="cover-slot">
                <img id="avatarPreview" th:if="${avatarUrl != null}" th:src="${avatarUrl}" alt="头像预览">
                <button type="button" class="btn" id="avatar-upload-btn">上传头像</button>
            </div>
            <input type="file" id="avatar-upload-input" accept="image/jpeg,image/png" hidden>
        </div>
        <button type="submit" class="btn btn-primary">保存并公开</button>
    </form>
    <script th:src="@{/js/upload.js}"></script>
    <script th:src="@{/js/settings-page.js}"></script>
</section>
</body>
</html>
