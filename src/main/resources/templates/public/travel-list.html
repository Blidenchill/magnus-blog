<!DOCTYPE html>
<html lang="zh-CN" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>旅行</title>
</head>
<body>
<section>
    <h1>旅行</h1>
    <div class="filter-bar" th:if="${tag != null}">
        <span>标签筛选：</span><span class="chip chip-tag" th:text="${tag}"></span>
        <a th:href="@{/life/travel}">清除</a>
    </div>
    <div th:replace="~{fragments/cards :: cardGrid(${page.content}, '还没有公开的旅行记录')}"></div>
    <nav th:replace="~{fragments/pagination :: pager(${page}, '/life/travel', ${tag != null ? '&tag=' + tag : ''})}"></nav>
</section>
</body>
</html>
