<!DOCTYPE html>
<html lang="zh-CN" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>相册</title>
</head>
<body>
<section>
    <h1>相册</h1>
    <div class="filter-bar" th:if="${tag != null}">
        <span>标签筛选：</span><span class="chip chip-tag" th:text="${tag}"></span>
        <a th:href="@{/photos}">清除</a>
    </div>
    <div th:replace="~{fragments/cards :: cardGrid(${page.content}, '还没有公开的相册')}"></div>
    <nav th:replace="~{fragments/pagination :: pager(${page}, '/photos', ${tag != null ? '&tag=' + tag : ''})}"></nav>
</section>
</body>
</html>
