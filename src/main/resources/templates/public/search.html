<!DOCTYPE html>
<html lang="zh-CN" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>搜索</title>
</head>
<body>
<section>
    <h1>搜索</h1>
    <form class="search-form" th:action="@{/search}" method="get" role="search">
        <input type="search" name="q" th:value="${q}" placeholder="搜索标题、摘要或标签…" aria-label="搜索关键词">
        <select name="type" aria-label="内容类型">
            <option value="" th:selected="${type == null or type.isBlank()}">全部类型</option>
            <option value="PHOTO" th:selected="${type == 'PHOTO'}">相册</option>
            <option value="BLOG" th:selected="${type == 'BLOG'}">Blog</option>
            <option value="FOOD" th:selected="${type == 'FOOD'}">菜谱</option>
            <option value="TRAVEL" th:selected="${type == 'TRAVEL'}">旅行</option>
        </select>
        <input type="text" name="tag" th:value="${tag}" placeholder="标签" aria-label="标签">
        <button type="submit" class="btn btn-primary">搜索</button>
    </form>
    <p class="result-count" th:if="${q != null and !q.isBlank()}"
       th:text="|共 ${page.totalElements} 条结果|"></p>
    <div th:replace="~{fragments/cards :: cardGrid(${page.content}, '没有找到匹配的内容')}"></div>
    <nav th:replace="~{fragments/pagination :: pager(${page}, '/search', ${(q != null ? '&q=' + q : '') + (type != null and !type.isBlank() ? '&type=' + type : '') + (tag != null ? '&tag=' + tag : '')})}"></nav>
</section>
</body>
</html>
