# 本机 Docker 测试覆盖文件（与 compose.yaml 叠加，仅供本机，勿用于生产）：
#   docker compose --env-file .env.local -f compose.yaml -f compose.local.yaml up -d db app
# 差异：secret 指向 ~/.magnus-local（免 sudo）、不跑 nginx/TLS、应用直接暴露 8080、
# 关闭 cookie secure（本机 http 直测）。完整说明见 docs/docker-local.md。
name: magnus

secrets:
  postgres_bootstrap_password:
    file: ${HOME}/.magnus-local/secrets/postgres-bootstrap-password
  app_database_password:
    file: ${HOME}/.magnus-local/secrets/app-database-password
  admin_password_hash:
    file: ${HOME}/.magnus-local/secrets/admin-password-hash

services:
  app:
    environment:
      # 仅本机/http 过渡期使用；生产（https）必须为 true。
      # 注意必须用 SERVER_SERVLET_SESSION_COOKIE_SECURE：application-prod.yaml 硬编码了
      # secure: true（优先级高于基础 yaml 里的 ${SESSION_COOKIE_SECURE} 占位符），
      # 而环境变量优先级又高于一切 yaml，所以这个名字才真正生效。
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
      APP_SITE_BASE_URL: http://localhost
    ports:
      - "80:8080"                              # 宿主 80 → 容器 8080（本机不经 nginx）
